<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eraser — Remove Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .card { background-color: #18181b; border: 1px solid #27272a; }
        .btn-primary { background-color: #fafafa; color: #09090b; transition: all 0.2s; }
        .btn-primary:hover { background-color: #e4e4e7; }
        .btn-primary:disabled { background-color: #27272a; color: #52525b; cursor: not-allowed; }
        #preview-container img { max-height: 400px; object-fit: contain; }
    </style>
</head>
<body class="antialiased">

    <main class="max-w-3xl mx-auto px-6 py-20">
        <div class="mb-12">
            <h1 class="text-4xl font-bold tracking-tight mb-4">Hapus Background.</h1>
            <p class="text-zinc-400">Pilih gambar JPG/PNG dan biarkan AI bekerja secara otomatis.</p>
        </div>

        <div class="card p-8 rounded-2xl mb-8">
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handlePreview(this)">
            <label for="imageInput" class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 rounded-xl p-10 cursor-pointer hover:border-zinc-600 transition">
                <div id="upload-label" class="text-center">
                    <p class="text-sm font-medium">Klik untuk upload gambar</p>
                    <p class="text-xs text-zinc-500 mt-2">Format PNG, JPG atau WEBP</p>
                </div>
                <img id="image-preview" class="hidden rounded-lg shadow-2xl">
            </label>

            <button onclick="processImage()" id="btnProcess" class="btn-primary w-full mt-6 py-4 rounded-xl font-bold uppercase tracking-tighter hidden">
                Remove Background
            </button>
        </div>

        <!-- Result -->
        <div id="result" class="hidden animate-in fade-in duration-500">
            <div class="card overflow-hidden rounded-2xl">
                <div class="bg-zinc-900/50 p-4 border-b border-zinc-800 flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-widest text-zinc-500">Result</span>
                    <a id="downloadBtn" href="#" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded text-white font-bold transition">Download PNG</a>
                </div>
                <div class="p-8 flex justify-center bg-[url('https://www.transparenttextures.com/patterns/checkerboard.png')]">
                    <img id="resultImg" src="" alt="Result">
                </div>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-white mb-4"></div>
            <p class="text-zinc-500 text-sm italic">Sedang memproses, mohon tunggu...</p>
        </div>
    </main>

    <script>
        function handlePreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const label = document.getElementById('upload-label');
                    const btn = document.getElementById('btnProcess');
                    
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    label.classList.add('hidden');
                    btn.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function processImage() {
            const input = document.getElementById('imageInput');
            const btn = document.getElementById('btnProcess');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            if (!input.files[0]) return;

            const formData = new FormData();
            formData.append('image', input.files[0]);

            btn.disabled = true;
            btn.innerText = 'Processing...';
            loading.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/remove-bg', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();

                if (data.success) {
                    const resultImg = document.getElementById('resultImg');
                    const downloadBtn = document.getElementById('downloadBtn');
                    
                    resultImg.src = data.result.url;
                    downloadBtn.href = data.result.url;
                    
                    resultDiv.classList.remove('hidden');
                    // Scroll ke result
                    resultDiv.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('Gagal: ' + data.message);
                }
            } catch (e) {
                alert('Terjadi kesalahan pada server.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Remove Background';
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
